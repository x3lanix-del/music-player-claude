name: Lumen
options:
  bundleIdPrefix: com.lumen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pl
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.30.0"
    CURRENT_PROJECT_VERSION: "63"
    YOUTUBE_API_KEY: "AIzaSyCLBVuBjpMfqvQ2xzUlSpxqoGzDuD33g_M"
    PLAYLISTS_URL: "https://bsggfvsibyjsvoitvgpt.supabase.co"
    PLAYLISTS_KEY: "sb_publishable_AgeVrH5mEtBb1O_5f90YOg_fdsR-ViZ"
    AUDD_TOKEN: "19e281b482d6544da573afb8eee719cb"
    SPOTIFY_CLIENT_ID: "1bbc21ddf49f4f88b80066f3132bc0de"
    SPOTIFY_CLIENT_SECRET: "2d7da6a9fbf64d3e9d18fe6c586a6ba1"
packages:
  YouTubeKit:
    path: Packages/YouTubeKit
targets:
  Lumen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lumen
    dependencies:
      - package: YouTubeKit
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Music Player
        CFBundleName: Music Player
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations:
          - pl
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.lumen.musicplayer
            CFBundleURLSchemes:
              - musicplayer
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSpeechRecognitionUsageDescription: "Aplikacja nasłuchuje pobranej piosenki, żeby dopasować do niej tekst (czas i tempo) i wyciszyć przekleństwa. Dźwięk jest przetwarzany na urządzeniu."
        NSMicrophoneUsageDescription: "Mikrofon służy tylko do rozpoznawania piosenki, która gra wokół Ciebie."
        NSLocalNetworkUsageDescription: "Aplikacja szuka w Twojej sieci Wi-Fi telewizorów, głośników i innych urządzeń oraz uruchamia stronę z tekstem piosenki dla innego urządzenia."
        NSBonjourServices:
          - _airplay._tcp
          - _raop._tcp
          - _googlecast._tcp
          - _spotify-connect._tcp
          - _sonos._tcp
          - _amzn-wplay._tcp
          - _samsungmsf._tcp
          - _androidtvremote2._tcp
        NSBluetoothAlwaysUsageDescription: "Bluetooth służy do wyszukiwania i łączenia słuchawek, głośników i aut, na których ma grać muzyka."
        NSBluetoothPeripheralUsageDescription: "Bluetooth służy do wyszukiwania i łączenia słuchawek, głośników i aut, na których ma grać muzyka."
        YouTubeAPIKey: "$(YOUTUBE_API_KEY)"
        AudDToken: "$(AUDD_TOKEN)"
        PlaylistsURL: "$(PLAYLISTS_URL)"
        PlaylistsKey: "$(PLAYLISTS_KEY)"
        SpotifyClientID: "$(SPOTIFY_CLIENT_ID)"
        SpotifyClientSecret: "$(SPOTIFY_CLIENT_SECRET)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumen.musicplayer
        PRODUCT_NAME: MusicPlayer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  Lumen:
    build:
      targets:
        Lumen: all
    run:
      config: Debug
    archive:
      config: Release
